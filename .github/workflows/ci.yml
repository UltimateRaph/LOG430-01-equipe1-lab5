name: example_CI

on: [push, pull_request]

jobs:
  publish_branch:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/raphael'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authentification GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nom de l’image
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:raph-labo5
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout Store Manager
        uses: actions/checkout@v4
        with:
          repository: ultimateraph/LOG430-01-equipe1-lab5
          ref: ${{ github.event.repository.name == 'LOG430-01-equipe1-lab5' && github.sha || 'raphael' }}
          token: ${{ secrets.LAB_REPOS_TOKEN }}
          persist-credentials: false
          path: store

      - name: Checkout paiement
        uses: actions/checkout@v4
        with:
          repository: ultimateraph/LOG430-01-equipe1-lab5-payment
          ref: ${{ github.event.repository.name == 'LOG430-01-equipe1-lab5-payment' && github.sha || 'raphael' }}
          token: ${{ secrets.LAB_REPOS_TOKEN }}
          persist-credentials: false
          path: payment

      - name: Préparer les configurations de test
        run: |
          cat > store/.env <<'EOF'
          DB_HOST=mysql
          DB_PORT=3306
          DB_USER=labo05
          DB_PASSWORD=labo05
          DB_NAME=labo05_db
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_DB=0
          EOF

          cat > payment/.env <<'EOF'
          DB_HOST=mysql_payments
          DB_PORT=3306
          DB_USER=labo05
          DB_PASSWORD=labo05
          DB_NAME=labo05_payments_db
          EOF

          docker network create labo05-network

      - name: Démarrer les bases de données
        run: |
          docker compose -p ci-store -f store/docker-compose.yml up -d --wait --wait-timeout 300 mysql redis
          docker compose -p ci-payment -f payment/docker-compose.yml up -d --wait --wait-timeout 300 mysql_payments

      - name: Démarrer les applications et KrakenD
        run: |
          docker compose -p ci-payment -f payment/docker-compose.yml up -d --build payments_api
          docker compose -p ci-store -f store/docker-compose.yml up -d --build store_manager krakend

      - name: Attendre les applications
        run: |
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors --max-time 5 http://localhost:5000/health-check
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors --max-time 5 http://localhost:5009/
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors --max-time 5 http://localhost:8080/__health

      - name: Tester Store Manager
        run: docker compose -p ci-store -f store/docker-compose.yml exec -T store_manager python -m pytest

      - name: Tester le paiement
        run: docker compose -p ci-payment -f payment/docker-compose.yml exec -T payments_api python -m pytest

      - name: Afficher les logs en cas d’échec
        if: failure()
        run: |
          docker compose -p ci-store -f store/docker-compose.yml logs --tail 100
          docker compose -p ci-payment -f payment/docker-compose.yml logs --tail 100

      - name: Nettoyer l’environnement de test
        if: always()
        run: |
          docker compose -p ci-store -f store/docker-compose.yml down -v
          docker compose -p ci-payment -f payment/docker-compose.yml down -v
